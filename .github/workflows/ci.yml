name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so an upstream DOAB index change surfaces here rather than in production.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production container
        run: docker build --tag doab-discovery-mcp:ci .

  live-api:
    # DOAB's index fails silently: a query naming a field it does not index returns zero records
    # rather than an error. This job is the only thing that catches an upstream index change, so
    # it runs on a schedule as well as on main, and is allowed to fail a PR without blocking it.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe the live DOAB API
        run: npm test
        env:
          DOAB_LIVE_TEST: "1"
